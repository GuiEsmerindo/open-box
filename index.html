<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F222A">
  <title>OpenBox | Cardápio</title>
  <meta name="description" content="Cardápio OpenBox: Coca-Cola gelada, KitKat, Trento Massimo e Ouro Branco. Peça pelo WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <img class="logo" src="img/logo.png" alt="OpenBox">
      <h1>Cardápio</h1>
      <p>Escolha o que quiser e mande o pedido pelo WhatsApp. Atendemos das <strong>11h55 às 12h55</strong>.</p>
    </header>

    <main>
      <ul id="cardapio" class="lista"></ul>
      <a id="btn-geral" class="link-conversa" href="#" target="_blank" rel="noopener">Prefere conversar? Fale com a gente no WhatsApp</a>
    </main>
  </div>

  <div class="barra">
    <div class="barra-info">
      <span id="barra-qtd">0 itens</span>
      <strong id="barra-total">R$ 0,00</strong>
    </div>
    <a id="btn-pedido" class="btn-zap" href="#" target="_blank" rel="noopener" aria-disabled="true">Enviar no WhatsApp</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
